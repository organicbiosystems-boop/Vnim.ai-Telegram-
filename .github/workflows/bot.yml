name: VNIM.AI bot

on:
  schedule:
    - cron: "*/10 * * * *"   # каждые 10 минут (GitHub иногда запускает с опозданием)
  workflow_dispatch: {}       # кнопка «Run workflow» для ручного запуска

concurrency:
  group: vnim-bot
  cancel-in-progress: false

permissions:
  contents: write   # чтобы сохранять базу в ветку bot-data

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      CHANNEL_ID: ${{ vars.CHANNEL_ID || '@VnimAi' }}
      DB_PATH: data/bot.db
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check secrets
        run: |
          for v in TELEGRAM_BOT_TOKEN ANTHROPIC_API_KEY DB_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Не задан секрет $v (Settings → Secrets and variables → Actions)"; exit 1; fi
          done

      # База зашифрована паролем DB_PASSWORD: репозиторий публичный.
      - name: Load database
        id: load
        run: |
          mkdir -p data
          if git fetch --depth=1 origin bot-data 2>/dev/null; then
            git show FETCH_HEAD:bot.db.enc > /tmp/bot.db.enc
            openssl enc -d -aes-256-cbc -pbkdf2 -in /tmp/bot.db.enc -out data/bot.db -pass env:DB_PASSWORD \
              || { echo "::error::Не удалось расшифровать базу — DB_PASSWORD изменился?"; exit 1; }
            python -c "import sqlite3; assert sqlite3.connect('data/bot.db').execute('PRAGMA integrity_check').fetchone()[0] == 'ok'" \
              || { echo "::error::База повреждена или неверный DB_PASSWORD"; exit 1; }
            echo "База загружена"
          else
            echo "Ветки bot-data ещё нет — первый запуск, начинаем с чистой базы"
          fi

      - name: Check Telegram connectivity
        continue-on-error: true
        run: curl -sS -m 60 -o /dev/null -w "api.telegram.org: HTTP %{http_code}, %{time_total}s\n" https://api.telegram.org/

      - name: Run bot
        run: python -m bot.main --once

      - name: Save database
        if: always() && steps.load.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f data/bot.db ] || exit 0
          openssl enc -aes-256-cbc -pbkdf2 -salt -in data/bot.db -out /tmp/bot.db.enc -pass env:DB_PASSWORD
          dir=$(mktemp -d) && cp /tmp/bot.db.enc "$dir/" && cd "$dir"
          git init -q -b bot-data
          git add bot.db.enc
          git -c user.name="vnim-bot" -c user.email="vnim-bot@users.noreply.github.com" commit -qm "Update bot database"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" bot-data
